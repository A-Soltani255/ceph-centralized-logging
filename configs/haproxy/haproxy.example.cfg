# EXAMPLE ONLY. Do not duplicate an existing bind :443.
frontend ft_https_tcp
    bind <VIP_OR_LOCAL_BIND_IP>:443
    mode tcp
    default_backend bk_ingress_https

backend bk_ingress_https
    mode tcp
    balance roundrobin
    option tcp-check
    server ingress_worker_1 <WORKER_IP_1>:30081 check
    server ingress_worker_2 <WORKER_IP_2>:30081 check
    server ingress_worker_3 <WORKER_IP_3>:30081 check
