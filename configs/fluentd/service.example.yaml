apiVersion: v1
kind: Service
metadata:
  name: fluentd-ceph
  namespace: fluentd
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: fluentd
    app.kubernetes.io/instance: fluentd
    app.kubernetes.io/component: fluentd
  ports:
    - name: forward-tls
      port: 24225
      targetPort: 24225
      protocol: TCP
