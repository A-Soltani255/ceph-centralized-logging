apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fluentd-ceph-ingress
  namespace: fluentd
  annotations:
    nginx.ingress.kubernetes.io/ssl-passthrough: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - logs.example.com
  rules:
    - host: logs.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fluentd-ceph
                port:
                  number: 24225
