apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: fluentd-ceph-server-certificate
  namespace: fluentd
spec:
  secretName: fluentd-ceph-server-tls
  dnsNames:
    - logs.example.com
  privateKey:
    rotationPolicy: Always
  usages:
    - digital signature
    - key encipherment
    - server auth
  issuerRef:
    name: vault-issuer
    kind: ClusterIssuer
