# Fluent Bit 2.2.2. EnvironmentFile remains /etc/fluent-bit/ceph.env.
# Keep input order and existing DB/storage paths for continuity.
[SERVICE]
    Flush 5
    Daemon Off
    Log_Level info
    HTTP_Server On
    HTTP_Listen 127.0.0.1
    HTTP_Port 2020
    Parsers_File /etc/fluent-bit/ceph-parsers.conf
    storage.path /var/lib/fluent-bit-ceph/storage
    storage.sync normal
    storage.checksum On
    storage.max_chunks_up 16
    storage.backlog.mem_limit 16M

[INPUT]
    Name tail
    Tag ceph.ops
    Path /var/log/ceph/${CEPH_FSID}/*.log,/var/log/ceph/cephadm.log
    Exclude_Path /var/log/ceph/${CEPH_FSID}/ceph.audit.log,/var/log/ceph/${CEPH_FSID}/ceph-client.rgw.*.log,/var/log/ceph/${CEPH_FSID}/ops-log-ceph-client.rgw.*.log
    Path_Key source_file
    Key log
    DB /var/lib/fluent-bit-ceph/ops.db
    DB.sync Normal
    DB.journal_mode WAL
    Read_from_Head Off
    Refresh_Interval 10
    Rotate_Wait 30
    Buffer_Chunk_Size 32k
    Buffer_Max_Size 2M
    Skip_Long_Lines On
    Static_Batch_Size 1M
    storage.type filesystem

[INPUT]
    Name tail
    Tag ceph.audit
    Path /var/log/ceph/${CEPH_FSID}/ceph.audit.log
    Path_Key source_file
    Key log
    DB /var/lib/fluent-bit-ceph/audit.db
    DB.sync Normal
    DB.journal_mode WAL
    Read_from_Head Off
    Refresh_Interval 10
    Rotate_Wait 30
    Buffer_Chunk_Size 32k
    Buffer_Max_Size 2M
    Skip_Long_Lines On
    Static_Batch_Size 1M
    storage.type filesystem

[INPUT]
    Name tail
    Tag ceph.ops
    Path /var/log/ceph/${CEPH_FSID}/ceph-client.rgw.*.log
    Path_Key source_file
    Key log
    DB /var/lib/fluent-bit-ceph/rgw-debug.db
    DB.sync Normal
    DB.journal_mode WAL
    Read_from_Head Off
    Refresh_Interval 10
    Rotate_Wait 30
    Buffer_Chunk_Size 32k
    Buffer_Max_Size 2M
    Skip_Long_Lines On
    Static_Batch_Size 1M
    storage.type filesystem

[INPUT]
    Name tail
    Tag ceph.ops
    Path /var/log/ceph/${CEPH_FSID}/ops-log-ceph-client.rgw.*.log
    Path_Key source_file
    Key log
    DB /var/lib/fluent-bit-ceph/rgw-ops.db
    DB.sync Normal
    DB.journal_mode WAL
    Read_from_Head Off
    Refresh_Interval 10
    Rotate_Wait 30
    Buffer_Chunk_Size 32k
    Buffer_Max_Size 2M
    Skip_Long_Lines On
    Static_Batch_Size 1M
    storage.type filesystem

[FILTER]
    Name parser
    Match ceph.*
    Key_Name log
    Parser ceph_channel
    Parser ceph_daemon
    Parser ceph_rgw_json
    Reserve_Data On
    Preserve_Key On

# Namespace the fixed RGW JSON schema; keep its original value types.
[FILTER]
    Name modify
    Match ceph.*
    Rename bucket ceph_rgw_bucket
    Rename object ceph_rgw_object
    Rename time ceph_rgw_time
    Rename time_local ceph_rgw_time_local
    Rename remote_addr ceph_rgw_remote_addr
    Rename user ceph_rgw_user
    Rename operation ceph_rgw_operation
    Rename uri ceph_rgw_uri
    Rename http_status ceph_rgw_http_status
    Rename error_code ceph_rgw_error_code
    Rename bytes_sent ceph_rgw_bytes_sent
    Rename bytes_received ceph_rgw_bytes_received
    Rename object_size ceph_rgw_object_size
    Rename total_time ceph_rgw_total_time
    Rename user_agent ceph_rgw_user_agent

[FILTER]
    Name parser
    Match ceph.*
    Key_Name source_file
    Parser ceph_path_rgw
    Parser ceph_path_daemon
    Parser ceph_path_audit
    Parser ceph_path_cluster
    Reserve_Data On
    Preserve_Key On

[FILTER]
    Name parser
    Match ceph.*
    Key_Name message
    Parser ceph_audit_detail
    Parser ceph_rocksdb
    Parser ceph_mon_detail
    Parser ceph_mgr_detail
    Parser ceph_rgw_done
    Parser ceph_rgw_start
    Parser ceph_rgw_beast
    Reserve_Data On
    Preserve_Key On

# Metadata belongs to record_modifier, not parser.
[FILTER]
    Name record_modifier
    Match ceph.*
    Record ceph_host ${CEPH_HOSTNAME}
    Record ceph_fsid ${CEPH_FSID}
    Record environment production

# Preserve the existing scalar 'log' mapping; do not create log.file.path.
[FILTER]
    Name modify
    Match ceph.*
    Add ceph_parse_status unparsed
    Add ceph_dataset ceph.other
    Copy log message

[FILTER]
    Name modify
    Match ceph.*
    Condition Key_exists ceph_time
    Set ceph_parse_status parsed

[FILTER]
    Name modify
    Match ceph.*
    Condition Key_exists ceph_rgw_time
    Set ceph_parse_status parsed

[FILTER]
    Name modify
    Match ceph.*
    Condition Key_value_equals ceph_daemon_type mon
    Set ceph_dataset ceph.mon

[FILTER]
    Name modify
    Match ceph.*
    Condition Key_value_equals ceph_daemon_type mgr
    Set ceph_dataset ceph.mgr

[FILTER]
    Name modify
    Match ceph.*
    Condition Key_value_equals ceph_daemon_type osd
    Set ceph_dataset ceph.osd

[FILTER]
    Name modify
    Match ceph.*
    Condition Key_value_equals ceph_daemon_type mds
    Set ceph_dataset ceph.mds

[FILTER]
    Name modify
    Match ceph.*
    Condition Key_value_equals ceph_daemon_type rgw
    Set ceph_dataset ceph.rgw

[FILTER]
    Name modify
    Match ceph.*
    Condition Key_value_equals ceph_file_kind ceph
    Set ceph_dataset ceph.cluster

[FILTER]
    Name modify
    Match ceph.*
    Condition Key_value_equals ceph_file_kind audit
    Set ceph_dataset ceph.audit

# Both existing tags still route to logs-ceph-default in shared Fluentd.
# ACK is at-least-once delivery, not deduplication or proof of ES indexing.
[OUTPUT]
    Name forward
    Match ceph.*
    Host logs.example.com
    Port 443
    Require_ack_response On
    Retry_Limit no_limits
    Workers 1
    tls On
    tls.verify On
    tls.vhost logs.example.com
    tls.ca_file /etc/fluent-bit/certs/server-ca.crt
    tls.crt_file /etc/fluent-bit/certs/client-fullchain.crt
    tls.key_file /etc/fluent-bit/certs/client.key
    storage.total_limit_size 4G
# At 4G the oldest queued chunks can be discarded; monitor output drops/disk.
# Read_from_Head Off does not skip existing DB offsets or queued chunks.
# Lines over 2M are skipped. No grep/throttle filter silently discards audit.
