name: Documentation validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install documentation dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Check artifacts and navigation
        run: npm run check
      - name: Lint Markdown
        run: npm run lint:markdown
      - name: Parse Mermaid
        run: npm run check:mermaid
      - name: Check Bash syntax and ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          command -v shellcheck
          find scripts -name '*.sh' -print0 | xargs -0 -n1 bash -n
          find scripts -name '*.sh' -print0 | xargs -0 shellcheck -x -P SCRIPTDIR
      - name: Download verified Gitleaks binary
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' \
            551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb \
            "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan complete Git history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner .'
      - name: Download verified kubeconform binary
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            --output "$RUNNER_TEMP/kubeconform.tar.gz"
          printf '%s  %s\n' \
            9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883 \
            "$RUNNER_TEMP/kubeconform.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/kubeconform.tar.gz" -C "$RUNNER_TEMP" kubeconform
      - name: Validate native Kubernetes examples against reference schema
        run: >-
          "$RUNNER_TEMP/kubeconform" -strict -summary -kubernetes-version 1.32.0
          configs/fluentd/service.example.yaml configs/ingress/ingress.example.yaml
      # CRDs and fragments require the actual target schemas and merged resources.
      # This workflow has no cluster credentials and never applies configurations.
